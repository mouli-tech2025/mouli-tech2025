name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: mouli-tech2025
          outputs: |
            output/snake.svg
            output/snake-dark.svg?palette=github-dark

      - name: Push snake animation
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update snake animation"
          add: "output/"