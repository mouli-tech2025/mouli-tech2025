name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: mouli-tech2025
          outputs: |
            output/snake.svg?color_snake=%23FF69B4&color_empty=%23D1D5DB&color_dots=%23FFB6C1
            output/snake-dark.svg?palette=github-dark&color_snake=%23FF69B4&color_empty=%23D1D5DB&color_dots=%23FFB6C1

      - name: Slow down snake animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for file in Path("output").glob("snake*.svg"):
              text = file.read_text()

              # Make animation durations longer
              text = re.sub(
                  r'dur="([0-9.]+)s"',
                  lambda m: f'dur="{float(m.group(1)) * 2.5:.2f}s"',
                  text
              )

              file.write_text(text)
          PY

      - name: Push snake animation
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update snake animation"
          add: "output/"
